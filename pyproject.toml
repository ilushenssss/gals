[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-planner"
version = "0.1.0"
description = "Планирование и распределение беспилотных авиационных работ — сервис Галс"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0,<3.0",
    "pyproj>=3.5,<4.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary,pool]>=3.1,<4.0",
    "geoalchemy2>=0.14,<0.16",
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: тест требует настоящий PostgreSQL/PostGIS (поднимается testcontainers или GALS_TEST_DATABASE_URL)",
]
