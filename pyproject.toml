[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-planner"
version = "0.1.0"
description = "Планирование и распределение беспилотных авиационных работ — сервис Галс"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0,<3.0",
    "pyproj>=3.5,<4.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uav_planner.api" = ["static/*", "static/**/*"]
