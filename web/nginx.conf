server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Загрузка обстановки и парка идёт multipart'ом и бывает крупной.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Имена файлов сборки содержат хеш — кешируем навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — наоборот, никогда: иначе пользователи залипают на старом
    # бандле и получают 404 на ассетах, которых больше нет.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API на том же origin, поэтому CORS не нужен ни здесь, ни в FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузки стримятся, а не буферизуются целиком в память nginx.
        proxy_request_buffering off;
        # Синхронное ожидание расчёта (wait_s) может длиться десятки секунд.
        proxy_read_timeout 300s;
    }

    # Клиентский роутинг: любой неизвестный путь отдаёт приложение.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
